name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python, quality, reconciliation, API, and dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install API, warehouse, and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[api,test]"
      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -v
      - name: Run the reference data-quality gate
        env:
          PYTHONPATH: src
        run: >-
          python -m data_quality.cli
          --input data/sample/order_events.ndjson
          --config config/data-quality-rules.json
          --json-output build/data-quality/report.json
          --markdown-output build/data-quality/report.md
          --history-db build/data-quality/history.db
      - name: Build the reference batch metric baseline
        env:
          PYTHONPATH: src
        run: >-
          python -m reconciliation.cli baseline
          --events data/sample/order_events.ndjson
          --output build/reconciliation/expected_metrics.ndjson
      - name: Build and verify the reference offline warehouse
        shell: pwsh
        run: ./scripts/offline-warehouse-build.ps1
      - name: Run dashboard unit tests
        run: node --test dashboard/tests/data.test.mjs

  flink-tests:
    name: Java and Flink tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml
      - name: Run Maven verification
        run: >-
          mvn -f flink-job/pom.xml
          --batch-mode
          --no-transfer-progress
          verify

  kafka-smoke-test:
    name: Kafka production and consumption smoke test
    needs: [python-tests, flink-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Display container runtime versions
        run: |
          docker version
          docker compose version
      - name: Start Kafka and create the business topic
        shell: pwsh
        run: ./scripts/kafka-up.ps1
      - name: Run the Kafka data-contract smoke test
        shell: pwsh
        env:
          PYTHON: python3
        run: ./scripts/kafka-smoke-test.ps1 -Count 20
      - name: Stop Kafka and remove the test volume
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/kafka-down.ps1 -RemoveData

  clickhouse-smoke-test:
    name: ClickHouse metric and anomaly replacement smoke test
    needs: [python-tests, flink-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Display container runtime versions
        run: |
          docker version
          docker compose version
      - name: Start ClickHouse and verify the schema
        shell: pwsh
        run: ./scripts/clickhouse-up.ps1
      - name: Verify replay-safe metric and anomaly replacement semantics
        shell: pwsh
        run: ./scripts/clickhouse-smoke-test.ps1
      - name: Stop ClickHouse and remove the test volume
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  e2e-acceptance:
    name: Kafka, Flink, ClickHouse, and reconciliation end-to-end acceptance
    needs: [python-tests, flink-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    env:
      FLINK_VERSION: "1.20.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml
      - name: Download and verify Apache Flink 1.20.1
        shell: bash
        run: |
          set -euo pipefail
          archive="flink-${FLINK_VERSION}-bin-scala_2.12.tgz"
          base_url="https://archive.apache.org/dist/flink/flink-${FLINK_VERSION}"
          install_root="${RUNNER_TEMP}/flink-dist"
          mkdir -p "${install_root}"
          cd "${install_root}"
          curl --fail --location --retry 3 --retry-delay 2 --remote-name "${base_url}/${archive}"
          curl --fail --location --retry 3 --retry-delay 2 --remote-name "${base_url}/${archive}.sha512"
          sha512sum --check "${archive}.sha512"
          tar --extract --gzip --file "${archive}"
          flink_home="${install_root}/flink-${FLINK_VERSION}"
          echo "FLINK_HOME=${flink_home}" >> "${GITHUB_ENV}"
          echo "${flink_home}/bin" >> "${GITHUB_PATH}"
      - name: Build the deployable Flink job
        run: >-
          mvn -f flink-job/pom.xml
          --batch-mode
          --no-transfer-progress
          clean package
          -DskipTests
      - name: Start the standalone Flink cluster
        shell: bash
        run: |
          set -euo pipefail
          "${FLINK_HOME}/bin/start-cluster.sh"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/overview >/dev/null; then
              flink list
              exit 0
            fi
            sleep 2
          done
          cat "${FLINK_HOME}"/log/* || true
          exit 1
      - name: Run isolated end-to-end acceptance
        shell: pwsh
        env:
          PYTHON: python3
        run: ./scripts/e2e-acceptance.ps1 -SkipBuild
      - name: Publish the reconciliation report to the job summary
        if: ${{ success() }}
        shell: pwsh
        run: |
          $report = Get-ChildItem -LiteralPath build/e2e -Filter report.md -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $report) { throw "The end-to-end report was not created." }
          Get-Content -LiteralPath $report.FullName | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload sanitized end-to-end evidence
        if: ${{ success() }}
        id: upload-e2e-evidence
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/e2e/*/expected_metrics.ndjson
            build/e2e/*/actual_metrics.ndjson
            build/e2e/*/report.json
            build/e2e/*/report.md
            build/e2e/*/flink-runtime.json
            build/e2e/*/flink-runtime.md
            build/e2e/*/manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Publish the evidence artifact link
        if: ${{ success() }}
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-e2e-evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-e2e-evidence.outputs.artifact-digest }}
        run: |
          @"

          ## Sanitized evidence artifact

          - Download: [$env:ARTIFACT_URL]($env:ARTIFACT_URL)
          - SHA-256: ``$env:ARTIFACT_DIGEST``
          - Retention: 90 days
          - Excludes raw business events, watermark events, and late-event identifiers
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Print Flink diagnostics after failure
        if: ${{ failure() }}
        shell: bash
        run: |
          for log_file in "${FLINK_HOME}"/log/*; do
            echo "===== ${log_file} ====="
            tail --lines 300 "${log_file}" || true
          done
      - name: Stop Flink and remove data services
        if: ${{ always() }}
        shell: bash
        run: |
          "${FLINK_HOME}/bin/stop-cluster.sh" || true
          docker compose down --volumes --remove-orphans || true
