name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python, API, and dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[api,test]"
      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -v
      - name: Run dashboard unit tests
        run: node --test dashboard/tests/data.test.mjs

  flink-tests:
    name: Java and Flink tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml
      - name: Run Maven verification
        run: >-
          mvn -f flink-job/pom.xml
          --batch-mode
          --no-transfer-progress
          verify

  kafka-smoke-test:
    name: Kafka production and consumption smoke test
    needs: [python-tests, flink-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Display container runtime versions
        run: |
          docker version
          docker compose version
      - name: Start Kafka and create the business topic
        shell: pwsh
        run: ./scripts/kafka-up.ps1
      - name: Run the Kafka data-contract smoke test
        shell: pwsh
        env:
          PYTHON: python3
        run: ./scripts/kafka-smoke-test.ps1 -Count 20
      - name: Stop Kafka and remove the test volume
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/kafka-down.ps1 -RemoveData

  clickhouse-smoke-test:
    name: ClickHouse replacement smoke test
    needs: [python-tests, flink-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Display container runtime versions
        run: |
          docker version
          docker compose version
      - name: Start ClickHouse and verify the schema
        shell: pwsh
        run: ./scripts/clickhouse-up.ps1
      - name: Verify replay-safe replacement semantics
        shell: pwsh
        run: ./scripts/clickhouse-smoke-test.ps1
      - name: Stop ClickHouse and remove the test volume
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
