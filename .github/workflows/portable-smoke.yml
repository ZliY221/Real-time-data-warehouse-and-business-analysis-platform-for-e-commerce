name: Portable smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-data-flow:
    name: ${{ matrix.os }} portable data flow
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install portable warehouse dependencies
        run: python -m pip install --disable-pip-version-check -e ".[warehouse]"
      - name: Run the public quickstart
        run: python scripts/quickstart.py --output-dir build/portable
