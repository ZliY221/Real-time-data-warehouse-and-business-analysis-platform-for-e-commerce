[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-realtime-warehouse"
version = "4.10.0"
description = "A reproducible real-time ecommerce data pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
api = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]
warehouse = [
    "duckdb==1.5.6",
]
test = [
    "duckdb==1.5.6",
    "httpx2==2.13.1",
]

[tool.ruff]
line-length = 100

